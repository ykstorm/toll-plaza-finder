name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # unit tests, Testcontainers integration tests, ArchUnit rules and the 85% coverage gate
      - name: Build and test
        run: mvn -B verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Docker image builds
        run: docker build -t toll-plaza-finder .
