# Render blueprint: New > Blueprint > pick this repo. Creates the API and a Postgres.
services:
  - type: web
    name: toll-plaza-finder
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase: { name: toll-plaza-db, property: host }
      - key: DATABASE_PORT
        fromDatabase: { name: toll-plaza-db, property: port }
      - key: DATABASE_NAME
        fromDatabase: { name: toll-plaza-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: toll-plaza-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: toll-plaza-db, property: password }

databases:
  - name: toll-plaza-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
