spring:
  application:
    name: toll-plaza-finder
  datasource:
    # either set DATABASE_URL (jdbc:postgresql://...) or the individual parts, which is what Render hands you
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:tolls}}
    username: ${DATABASE_USERNAME:tolls}
    password: ${DATABASE_PASSWORD:tolls}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  # render/railway terminate TLS in front of us. without this swagger builds http:// urls and try-it-out breaks
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json

tolls:
  data:
    toll-plaza-csv: classpath:data/toll_plaza_india.csv
    pincode-csv: classpath:data/pincode_centroids.csv
    import-on-startup: true
  matching:
    corridor-meters: ${TOLLS_CORRIDOR_METERS:750}
    duplicate-window-meters: 2000
    same-site-meters: 1000
  routing:
    osrm-base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
    connect-timeout: 3s
    read-timeout: 15s
    user-agent: toll-plaza-finder/1.0 (+https://github.com/ykstorm)
    max-snap-meters: 25000
  cache:
    memory-max-entries: 10000
    memory-ttl: 6h
    database-ttl: 30d
  rate-limit:
    # per client ip. plenty for a person in swagger, stops a script from burning our OSRM quota
    requests-per-minute: ${TOLLS_RATE_LIMIT_PER_MINUTE:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # puts the X-Request-Id on every line
    level: "%5p [%X{requestId:-}]"
  level:
    dev.lakshyaraj.tollplazas: INFO
